[project]
name = "drug-discovery-sim-env"
version = "0.1.0"
description = "Advanced drug discovery RL simulation environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "networkx>=3.2",
  "requests>=2.32",
  "fastapi>=0.115",
  "rank-bm25>=0.2",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.4",
  "sentence-transformers>=2.7",
]
chem = [
  "rdkit",
]
training = [
  "trl",
  "peft",
  "transformers",
  "torch",
]
test = [
  "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drug_discovery_env*"]
